<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBR Laundry Service</title>
<style>
  :root {
    --teal: #0f766e;
    --teal-dark: #0b5b55;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --blue: #1d4ed8;
    --blue-bg: #dbeafe;
    --green: #15803d;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--teal);
    color: white;
    padding: 18px 16px 14px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }

  .tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 8px;
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active {
    color: var(--teal);
    border-bottom-color: var(--teal);
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }

  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--text); }
  label:first-child { margin-top: 0; }
  input[type="text"], input[list], textarea {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    color: var(--text);
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding: 12px;
    background: #fef2f2;
    border-radius: 8px;
    border: 1px solid #fecaca;
  }
  .switch-row span { font-size: 14px; font-weight: 600; color: var(--red); }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #cbd5e1;
    border-radius: 999px;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 3px;
    top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .slider { background: var(--red); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  button.primary {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    color: white;
    background: var(--teal);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--teal);
    background: white;
    border: 1px solid var(--teal);
    border-radius: 8px;
    cursor: pointer;
  }

  .msg { margin-top: 12px; font-size: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.success { background: var(--green-bg); color: var(--green); }
  .msg.error { background: #fee2e2; color: var(--red); }

  .req-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .req-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .req-villa { font-size: 16px; font-weight: 700; }
  .req-staff { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .req-notes { font-size: 13px; color: var(--text); margin-top: 6px; }
  .req-time { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.pending { background: var(--amber-bg); color: var(--amber); }
  .badge.done { background: var(--blue-bg); color: var(--blue); }
  .badge.collected { background: var(--green-bg); color: var(--green); }
  .badge.urgent { background: #fee2e2; color: var(--red); margin-left: 6px; }

  .collect-form { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .collect-form input, .collect-form textarea { margin-bottom: 8px; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 0; }

  footer { text-align: center; padding: 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>CBR Laundry Service</h1>
  <p>Villa laundry request &amp; collection</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="submit">New Request</button>
  <button class="tab-btn" data-tab="track">Track &amp; Collect</button>
</div>

<main>
  <!-- NEW REQUEST -->
  <section id="panel-submit" class="panel active">
    <div class="card">
      <form id="submit-form">
        <label for="villa">Villa Number</label>
        <input type="text" id="villa" list="villa-list" placeholder="Search or select villa..." autocomplete="off" required>
        <datalist id="villa-list"></datalist>

        <label for="staffName">Staff Name</label>
        <input type="text" id="staffName" placeholder="Your name" required>

        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Anything the laundry team should know (optional)"></textarea>

        <div class="switch-row">
          <span>Mark as Urgent</span>
          <label class="switch">
            <input type="checkbox" id="urgent">
            <span class="slider"></span>
          </label>
        </div>

        <button type="submit" class="primary" id="submit-btn">Submit Request</button>
        <div class="msg" id="submit-msg"></div>
      </form>
    </div>
  </section>

  <!-- TRACK & COLLECT -->
  <section id="panel-track" class="panel">
    <div class="card">
      <label for="track-villa">Villa Number</label>
      <input type="text" id="track-villa" list="villa-list" placeholder="Search or select villa..." autocomplete="off">
      <button class="primary" id="track-btn" style="margin-top:14px;">Look Up Requests</button>
      <div class="msg" id="track-msg"></div>
    </div>
    <div id="track-results"></div>
  </section>
</main>

<footer>CBR Laundry Service</footer>

<script>
const EXCLUDED_VILLAS = new Set([13, 48, 49]);
const villaList = document.getElementById('villa-list');
for (let n = 1; n <= 50; n++) {
  if (EXCLUDED_VILLAS.has(n)) continue;
  const opt = document.createElement('option');
  opt.value = String(n);
  villaList.appendChild(opt);
}

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function isValidVilla(raw) {
  const n = Number(raw);
  return Number.isInteger(n) && n >= 1 && n <= 50 && !EXCLUDED_VILLAS.has(n);
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg show ' + type;
}

// Submit form
const submitForm = document.getElementById('submit-form');
const submitBtn = document.getElementById('submit-btn');
const submitMsg = document.getElementById('submit-msg');

submitForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitMsg.className = 'msg';

  const villaNumber = document.getElementById('villa').value.trim();
  const staffName = document.getElementById('staffName').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const urgent = document.getElementById('urgent').checked;

  if (!isValidVilla(villaNumber)) {
    showMsg(submitMsg, 'Please select a valid villa number.', 'error');
    return;
  }
  if (!staffName) {
    showMsg(submitMsg, 'Please enter your name.', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ villaNumber: Number(villaNumber), staffName, notes, urgent })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Submission failed');

    showMsg(submitMsg, 'Request submitted! We\'ll get to it shortly.', 'success');
    submitForm.reset();
  } catch (err) {
    showMsg(submitMsg, err.message, 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Request';
  }
});

// Track & collect
const trackBtn = document.getElementById('track-btn');
const trackMsg = document.getElementById('track-msg');
const trackResults = document.getElementById('track-results');

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function statusBadge(status) {
  const cls = status.toLowerCase();
  return `<span class="badge ${cls}">${status}</span>`;
}

function renderResults(records) {
  if (!records.length) {
    trackResults.innerHTML = '<div class="card"><div class="empty">No laundry requests found for this villa.</div></div>';
    return;
  }

  trackResults.innerHTML = records.map(r => {
    let body = `
      <div class="req-top">
        <div>
          <div class="req-villa">Villa ${r.villaNumber} ${r.urgent ? '<span class="badge urgent">URGENT</span>' : ''}</div>
          <div class="req-staff">${escapeHtml(r.staffName)}</div>
        </div>
        ${statusBadge(r.status)}
      </div>
      ${r.notes ? `<div class="req-notes">${escapeHtml(r.notes)}</div>` : ''}
      <div class="req-time">Submitted ${fmtTime(r.createdAt)}</div>
    `;

    if (r.status === 'Done') {
      body += `
        <div class="req-time">Ready since ${fmtTime(r.doneAt)}</div>
        <div class="collect-form" data-id="${r.id}">
          <label style="margin-top:0;">Collector Name</label>
          <input type="text" class="collector-name" placeholder="Who is collecting?">
          <label>Notes (optional)</label>
          <textarea class="collector-notes" placeholder="Anything to note about the collection"></textarea>
          <button class="secondary collect-btn">Mark Collected</button>
          <div class="msg collect-msg"></div>
        </div>
      `;
    } else if (r.status === 'Collected') {
      body += `<div class="req-time">Collected by ${escapeHtml(r.collectedBy || '')} on ${fmtTime(r.collectedAt)}</div>`;
      if (r.collectedNotes) body += `<div class="req-notes">${escapeHtml(r.collectedNotes)}</div>`;
    }

    return `<div class="req-item">${body}</div>`;
  }).join('');

  trackResults.querySelectorAll('.collect-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const wrap = btn.closest('.collect-form');
      const id = wrap.dataset.id;
      const collectedBy = wrap.querySelector('.collector-name').value.trim();
      const collectedNotes = wrap.querySelector('.collector-notes').value.trim();
      const msgEl = wrap.querySelector('.collect-msg');

      if (!collectedBy) {
        showMsg(msgEl, 'Please enter the collector name.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const res = await fetch(`/api/requests/${id}/collect`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ collectedBy, collectedNotes })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not update request');
        await runLookup();
      } catch (err) {
        showMsg(msgEl, err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Mark Collected';
      }
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function runLookup() {
  const villaNumber = document.getElementById('track-villa').value.trim();
  trackMsg.className = 'msg';

  if (!isValidVilla(villaNumber)) {
    showMsg(trackMsg, 'Please select a valid villa number.', 'error');
    trackResults.innerHTML = '';
    return;
  }

  trackBtn.disabled = true;
  trackBtn.textContent = 'Searching...';
  try {
    const res = await fetch(`/api/requests?villa=${encodeURIComponent(villaNumber)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Lookup failed');
    renderResults(data.records);
  } catch (err) {
    showMsg(trackMsg, err.message, 'error');
  } finally {
    trackBtn.disabled = false;
    trackBtn.textContent = 'Look Up Requests';
  }
}

trackBtn.addEventListener('click', runLookup);
document.getElementById('track-villa').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); runLookup(); }
});
</script>

</body>
</html>
