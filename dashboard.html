<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry Manager Dashboard</title>
<style>
  :root {
    --teal: #0f766e;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --blue: #1d4ed8;
    --blue-bg: #dbeafe;
    --green: #15803d;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--teal);
    color: white;
    padding: 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }
  .header-actions {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-btn, .logout-btn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn[hidden], .logout-btn[hidden] { display: none; }
  .icon-btn svg, .logout-icon { width: 14px; height: 14px; flex-shrink: 0; }
  .icon-btn { position: relative; }
  .icon-btn.subscribed {
    background: white;
    color: var(--teal);
    border-color: white;
  }
  .notify-dot {
    display: none;
    position: absolute;
    top: -3px;
    right: -3px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    border: 1.5px solid var(--teal);
  }
  .icon-btn.subscribed .notify-dot { display: block; }
  .icon-btn:disabled { opacity: 0.6; cursor: default; }

  @media (max-width: 480px) {
    header { padding: 12px; }
    header h1 { font-size: 15px; }
    header p { font-size: 11px; }
    .header-actions {
      top: 10px;
      right: 10px;
      gap: 6px;
    }
    .icon-btn, .logout-btn {
      padding: 7px;
      border-radius: 50%;
    }
    .logout-text { display: none; }
    .tabs { top: 52px; }
  }

  .tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 58px;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    background: none;
    border: none;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }
  .tab-btn .count {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 4px;
    border-radius: 999px;
    background: #e2e8f0;
    color: var(--text);
    font-size: 11px;
  }

  main { max-width: 480px; margin: 0 auto; padding: 12px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .req-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .req-item.urgent { border-color: var(--red); background: #fff5f5; }
  .req-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .req-villa { font-size: 20px; font-weight: 800; }
  .req-staff { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .req-notes {
    font-size: 14px;
    color: var(--text);
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    font-style: italic;
  }
  .req-time {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 8px;
  }
  .req-time svg { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.8; }

  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.pending { background: var(--amber-bg); color: var(--amber); }
  .badge.done { background: var(--blue-bg); color: var(--blue); }
  .badge.collected { background: var(--green-bg); color: var(--green); }
  .badge.urgent { background: var(--red); color: white; }

  button.done-btn {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    color: white;
    background: var(--teal);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.done-btn:disabled { opacity: 0.6; }

  .collect-form { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .collect-form label { display: block; font-size: 12px; font-weight: 600; margin: 0 0 4px; color: var(--text); }
  .collect-form input[type="text"], .collect-form textarea {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    margin-bottom: 8px;
  }
  .collect-form textarea { resize: vertical; min-height: 60px; }

  .awaiting-actions { display: flex; gap: 8px; margin-top: 12px; }
  .awaiting-actions button { flex: 1; margin-top: 0; }

  button.undone-btn {
    padding: 11px;
    font-size: 13px;
    font-weight: 700;
    color: var(--red);
    background: white;
    border: 1.5px solid var(--red);
    border-radius: 8px;
    cursor: pointer;
  }
  button.undone-btn:disabled { opacity: 0.6; }

  button.collect-toggle-btn {
    padding: 11px;
    font-size: 13px;
    font-weight: 700;
    color: var(--teal);
    background: white;
    border: 1.5px solid var(--teal);
    border-radius: 8px;
    cursor: pointer;
  }
  button.collect-confirm-btn {
    width: 100%;
    padding: 11px;
    font-size: 13px;
    font-weight: 700;
    color: white;
    background: var(--teal);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.collect-confirm-btn:disabled { opacity: 0.6; }

  .msg { margin-top: 8px; font-size: 12px; padding: 8px 10px; border-radius: 6px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: #fee2e2; color: var(--red); }

  .collected-filter {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .collected-filter svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .collected-filter input {
    border: none;
    outline: none;
    font-size: 14px;
    width: 100%;
    font-family: inherit;
    color: var(--text);
  }
  .collected-group { margin-bottom: 16px; }
  .collected-group-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
    padding-left: 2px;
  }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }
  .refresh-note { text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0 16px; }
</style>
</head>
<body>

<header>
  <div class="header-actions">
    <button class="logout-btn" id="logout-btn" aria-label="Log out">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="logout-text">Log out</span>
    </button>
    <button class="icon-btn" id="notify-btn" aria-label="Enable notifications" title="Enable notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notify-dot"></span>
    </button>
  </div>
  <h1>Laundry Requests Dashboard</h1>
  <p>CBR Laundry Service</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="active">Active <span class="count" id="active-count">0</span></button>
  <button class="tab-btn" data-tab="awaiting">Awaiting <span class="count" id="awaiting-count">0</span></button>
  <button class="tab-btn" data-tab="collected">Collected <span class="count" id="collected-count">0</span></button>
</div>

<main>
  <section id="panel-active" class="panel active"></section>
  <section id="panel-awaiting" class="panel"></section>
  <section id="panel-collected" class="panel">
    <div class="collected-filter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="number" id="collected-villa-filter" min="1" max="50" step="1" inputmode="numeric" autocomplete="off" aria-label="Filter by Villa Number" placeholder="Filter by Villa Number">
    </div>
    <div id="collected-list"></div>
  </section>
  <div class="refresh-note" id="refresh-note">Refreshing...</div>
</main>

<script>
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function timeLine(text) {
  return `<div class="req-time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>${text}</span></div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderPending(records) {
  const panel = document.getElementById('panel-active');
  document.getElementById('active-count').textContent = records.length;

  if (!records.length) {
    panel.innerHTML = '<div class="empty">No active requests. All caught up!</div>';
    return;
  }

  panel.innerHTML = records.map(r => `
    <div class="req-item ${r.urgent ? 'urgent' : ''}" data-id="${r.id}">
      <div class="req-top">
        <div>
          <div class="req-villa">Villa ${r.villaNumber}</div>
          <div class="req-staff">${escapeHtml(r.staffName)}</div>
        </div>
        ${r.urgent ? '<span class="badge urgent">URGENT</span>' : '<span class="badge pending">Pending</span>'}
      </div>
      ${r.notes ? `<div class="req-notes">${escapeHtml(r.notes)}</div>` : ''}
      ${timeLine('Submitted ' + fmtTime(r.createdAt))}
      <button class="done-btn">Mark Done</button>
    </div>
  `).join('');

  panel.querySelectorAll('.done-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = btn.closest('.req-item');
      const id = item.dataset.id;
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const res = await fetch(`/api/requests/${id}/done`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not update request');
        await loadAll();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = 'Mark Done';
      }
    });
  });
}

function renderAwaiting(records) {
  const panel = document.getElementById('panel-awaiting');
  document.getElementById('awaiting-count').textContent = records.length;

  if (!records.length) {
    panel.innerHTML = '<div class="empty">Nothing waiting on collection.</div>';
    return;
  }

  panel.innerHTML = records.map(r => `
    <div class="req-item" data-id="${r.id}">
      <div class="req-top">
        <div>
          <div class="req-villa">Villa ${r.villaNumber}</div>
          <div class="req-staff">${escapeHtml(r.staffName)}</div>
        </div>
        <span class="badge done">Done</span>
      </div>
      ${r.notes ? `<div class="req-notes">${escapeHtml(r.notes)}</div>` : ''}
      ${timeLine('Ready since ' + fmtTime(r.doneAt))}
      <div class="awaiting-actions">
        <button class="undone-btn">Move to Pending</button>
        <button class="collect-toggle-btn">Mark as Collected</button>
      </div>
      <div class="collect-form" hidden>
        <label>Staff Name</label>
        <input type="text" class="collector-name" autocomplete="off">
        <label>Notes (optional)</label>
        <textarea class="collector-notes"></textarea>
        <button class="collect-confirm-btn">Confirm Collected</button>
        <div class="msg collect-msg"></div>
      </div>
    </div>
  `).join('');

  panel.querySelectorAll('.collect-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const form = btn.closest('.req-item').querySelector('.collect-form');
      const opening = form.hidden;
      form.hidden = !opening;
      btn.textContent = opening ? 'Cancel' : 'Mark as Collected';
    });
  });

  panel.querySelectorAll('.undone-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = btn.closest('.req-item');
      const id = item.dataset.id;
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const res = await fetch(`/api/requests/${id}/undone`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not update request');
        await loadAll();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = 'Move to Pending';
      }
    });
  });

  panel.querySelectorAll('.collect-confirm-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = btn.closest('.req-item');
      const id = item.dataset.id;
      const collectedBy = item.querySelector('.collector-name').value.trim();
      const collectedNotes = item.querySelector('.collector-notes').value.trim();
      const msgEl = item.querySelector('.collect-msg');

      if (!collectedBy) {
        msgEl.textContent = 'Please enter the staff name.';
        msgEl.className = 'msg show error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const res = await fetch(`/api/requests/${id}/collect`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ collectedBy, collectedNotes })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not update request');
        await loadAll();
      } catch (err) {
        msgEl.textContent = err.message;
        msgEl.className = 'msg show error';
        btn.disabled = false;
        btn.textContent = 'Confirm Collected';
      }
    });
  });
}

let collectedRecordsCache = [];

function collectedDateGroup(iso, boundaries) {
  const d = new Date(iso);
  if (d >= boundaries.startOfToday) return 'Today';
  if (d >= boundaries.startOfYesterday) return 'Yesterday';
  if (d >= boundaries.startOfWeek) return 'This Week';
  return 'Past';
}

function renderCollectedItem(r) {
  return `
    <div class="req-item">
      <div class="req-top">
        <div>
          <div class="req-villa">Villa ${r.villaNumber}</div>
          <div class="req-staff">${escapeHtml(r.staffName)}</div>
        </div>
        <span class="badge collected">Collected</span>
      </div>
      ${r.notes ? `<div class="req-notes">${escapeHtml(r.notes)}</div>` : ''}
      ${timeLine('Submitted ' + fmtTime(r.createdAt))}
      ${timeLine('Ready ' + fmtTime(r.doneAt))}
      ${timeLine('Collected by ' + escapeHtml(r.collectedBy || '') + ' · ' + fmtTime(r.collectedAt))}
      ${r.collectedNotes ? `<div class="req-notes">${escapeHtml(r.collectedNotes)}</div>` : ''}
    </div>
  `;
}

function renderCollectedList() {
  const container = document.getElementById('collected-list');
  const filterRaw = document.getElementById('collected-villa-filter').value.trim();
  let records = collectedRecordsCache;

  if (filterRaw) {
    const villaNum = Number(filterRaw);
    records = records.filter(r => r.villaNumber === villaNum);
  }

  if (!records.length) {
    container.innerHTML = `<div class="empty">${filterRaw ? 'No collected requests for that villa.' : 'No collected requests yet.'}</div>`;
    return;
  }

  const sorted = [...records].sort((a, b) => new Date(b.collectedAt) - new Date(a.collectedAt));

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfYesterday = new Date(startOfToday);
  startOfYesterday.setDate(startOfYesterday.getDate() - 1);
  const startOfWeek = new Date(startOfToday);
  startOfWeek.setDate(startOfWeek.getDate() - startOfToday.getDay());
  const boundaries = { startOfToday, startOfYesterday, startOfWeek };

  const groups = { Today: [], Yesterday: [], 'This Week': [], Past: [] };
  sorted.forEach(r => groups[collectedDateGroup(r.collectedAt, boundaries)].push(r));

  container.innerHTML = Object.entries(groups)
    .filter(([, list]) => list.length)
    .map(([label, list]) => `
      <div class="collected-group">
        <div class="collected-group-label">${label}</div>
        ${list.map(renderCollectedItem).join('')}
      </div>
    `).join('');
}

function renderCollected(records) {
  collectedRecordsCache = records;
  document.getElementById('collected-count').textContent = records.length;
  renderCollectedList();
}

document.getElementById('collected-villa-filter').addEventListener('input', renderCollectedList);

async function loadAll({ preserveOpenForms } = {}) {
  try {
    const [pendingRes, doneRes, collectedRes] = await Promise.all([
      fetch('/api/requests?status=Pending'),
      fetch('/api/requests?status=Done'),
      fetch('/api/requests?status=Collected')
    ]);
    const pendingData = await pendingRes.json();
    const doneData = await doneRes.json();
    const collectedData = await collectedRes.json();
    if (!pendingRes.ok) throw new Error(pendingData.error || 'Failed to load');
    if (!doneRes.ok) throw new Error(doneData.error || 'Failed to load');
    if (!collectedRes.ok) throw new Error(collectedData.error || 'Failed to load');

    renderPending(pendingData.records);
    const formOpen = document.querySelector('#panel-awaiting .collect-form:not([hidden])');
    if (!(preserveOpenForms && formOpen)) {
      renderAwaiting(doneData.records);
    }
    renderCollected(collectedData.records);
    document.getElementById('refresh-note').textContent =
      'Last updated ' + new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  } catch (err) {
    document.getElementById('refresh-note').textContent = 'Could not refresh: ' + err.message;
  }
}

loadAll();
setInterval(() => loadAll({ preserveOpenForms: true }), 15000);

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login.html';
});

// Push notifications (manager side — notified on new requests and collections)
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const output = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) output[i] = raw.charCodeAt(i);
  return output;
}

const notifyBtn = document.getElementById('notify-btn');

async function checkSubscribed(endpoint) {
  const res = await fetch('/api/push/status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ endpoint, role: 'manager' })
  });
  if (!res.ok) return false;
  const data = await res.json();
  return !!data.subscribed;
}

async function updateNotifyBtnState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    notifyBtn.hidden = true;
    return;
  }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    const subscribed = sub ? await checkSubscribed(sub.endpoint) : false;
    notifyBtn.classList.toggle('subscribed', subscribed);
    notifyBtn.title = subscribed ? 'Notifications on — click to turn off' : 'Enable notifications';
  } catch {
    // ignore — leave button in default state
  }
}

async function disableManagerNotifications() {
  const reg = await navigator.serviceWorker.getRegistration();
  const sub = reg ? await reg.pushManager.getSubscription() : null;
  if (sub) {
    await fetch('/api/push/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: sub.endpoint, role: 'manager' })
    });
  }
  notifyBtn.classList.remove('subscribed');
  notifyBtn.title = 'Enable notifications';
}

async function enableManagerNotifications() {
  const reg = await navigator.serviceWorker.register('/service-worker.js');
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    alert('Notification permission was not granted.');
    return;
  }

  const keyRes = await fetch('/api/push/public-key');
  const keyData = await keyRes.json();
  if (!keyRes.ok) throw new Error(keyData.error || 'Push notifications are not configured');

  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
    });
  }

  const res = await fetch('/api/push/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ subscription: sub.toJSON(), role: 'manager' })
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || 'Could not subscribe');
  }
  notifyBtn.classList.add('subscribed');
  notifyBtn.title = 'Notifications on — click to turn off';
}

notifyBtn.addEventListener('click', async () => {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Push notifications are not supported in this browser.');
    return;
  }

  if (notifyBtn.classList.contains('subscribed')) {
    if (!confirm('Turn off notifications for new requests and collections?')) return;
    notifyBtn.disabled = true;
    try {
      await disableManagerNotifications();
    } catch (err) {
      alert(err.message || 'Could not turn off notifications.');
    } finally {
      notifyBtn.disabled = false;
    }
    return;
  }

  notifyBtn.disabled = true;
  try {
    await enableManagerNotifications();
  } catch (err) {
    alert(err.message || 'Could not enable notifications.');
  } finally {
    notifyBtn.disabled = false;
  }
});

updateNotifyBtnState();
</script>

</body>
</html>
